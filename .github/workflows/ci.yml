name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify plugin manifest and versions
        run: |
          python - <<'PY'
          import re, tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("herdr-plugin.toml").read_text())
          package = re.search(
              r'__version__ = "([^"]+)"',
              Path("herdr_webhook_notify/__init__.py").read_text(),
          ).group(1)
          project = re.search(
              r'^version = "([^"]+)"',
              Path("pyproject.toml").read_text(),
              re.MULTILINE,
          ).group(1)
          versions = {manifest["version"], package, project}
          assert len(versions) == 1, f"version mismatch: {versions}"
          assert manifest["events"], "manifest must declare event hooks"
          assert manifest["actions"], "manifest must declare actions"
          print("manifest ok, version", versions.pop())
          PY
