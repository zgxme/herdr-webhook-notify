[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-webhook-notify"
version = "0.1.0"
description = "Herdr plugin that forwards agent notifications to webhook services"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zgxme" }]
keywords = ["herdr", "herdr-plugin", "notifications", "webhook", "slack", "feishu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/zgxme/herdr-webhook-notify"

[tool.setuptools]
packages = ["herdr_webhook_notify", "herdr_webhook_notify.providers", "vendor", "vendor.tomli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
